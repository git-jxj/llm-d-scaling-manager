apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The DisaggregatedSet role writer, cluster scope (internal/dsetwriter,
# DSET_ROLE_WRITER). It scales the Static roles of DisaggregatedSets annotated
# scaling-manager.llmd.ai/role-writer by writing spec.roles[].spec.replicas:
# the path for roles with no /scale (scaling.mode Static, or LWS before
# v0.10.0). External roles are scaled by KEDA through their role scaler and
# need none of this.
#
# Opt-in, admin-applied, and NOT listed in any overlay: it grants patch on every
# DisaggregatedSet in the cluster, which reaches every field of the set, and
# turns the writer on in the Deployment. The installer does not add it.
#
# Apply it ABOVE the overlay, in a kustomization of your own that lists the
# overlay under resources, this component under components, and the
# controller's namespace under `namespace:`. The names here are final, as the
# overlay's namePrefix leaves them. Listed in the overlay's own components
# instead, the names get the prefix twice and the Deployment patch matches
# nothing, so the writer stays off with no error; without `namespace:`, the
# binding's subject has none. See docs/proposals/disaggregatedset.md.
resources:
- dset-role-writer-clusterrole.yaml
- dset-role-writer-clusterrolebinding.yaml

patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: DSET_ROLE_WRITER
        value: "true"
  target:
    group: apps
    version: v1
    kind: Deployment
    name: scaling-manager-controller-manager
