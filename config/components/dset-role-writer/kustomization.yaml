apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# The DisaggregatedSet role writer, cluster scope (internal/dsetwriter,
# DSET_ROLE_WRITER). It scales the Static roles of DisaggregatedSets annotated
# scaling-manager.llmd.ai/role-writer by writing spec.roles[].spec.replicas:
# the path for roles with no /scale (scaling.mode Static, or LWS before
# v0.10.0). External roles are scaled by KEDA through their role scaler and
# need none of this.
#
# Opt-in, and NOT listed in any overlay: the installer adds it to the render
# only with DSET_ROLE_WRITER=true (llmsm_append_dset_role_writer_component). It
# grants get, list and patch on every DisaggregatedSet in the cluster, which
# reaches every field of the set, and turns the writer on in the Deployment.
#
# Applied at the installer's top level, above the overlay's namePrefix, so the
# names here are the final ones; the installer renames the ClusterRole and its
# binding per install like the others (LLMSM_OWNED_CLUSTER_ROLES).
resources:
- dset-role-writer-clusterrole.yaml
- dset-role-writer-clusterrolebinding.yaml

patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: DSET_ROLE_WRITER
        value: "true"
  target:
    group: apps
    version: v1
    kind: Deployment
    name: scaling-manager-controller-manager
