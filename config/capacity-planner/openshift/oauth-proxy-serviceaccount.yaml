apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacity-planner
  annotations:
    # The ServiceAccount is the proxy's OAuth client; after login the OAuth
    # server redirects only to this Route.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"capacity-planner"}}'
# The proxy reads the account's token as its OAuth client secret.
automountServiceAccountToken: true
