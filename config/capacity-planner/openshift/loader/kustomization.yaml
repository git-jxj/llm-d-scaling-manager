apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The loader Pod of config/capacity-planner/loader, without fixed IDs:
# OpenShift gives it the namespace's user, the same one the planner runs as.
resources:
  - ../../loader

patches:
  - target:
      kind: Pod
      name: capacity-planner-loader
    patch: |-
      - op: remove
        path: /spec/securityContext/runAsUser
      - op: remove
        path: /spec/securityContext/runAsGroup
      - op: remove
        path: /spec/securityContext/fsGroup
