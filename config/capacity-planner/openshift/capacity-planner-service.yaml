apiVersion: v1
kind: Service
metadata:
  name: capacity-planner
  labels:
    app.kubernetes.io/name: capacity-planner
    app.kubernetes.io/part-of: llm-d-scaling-manager
  annotations:
    # The service CA issues the proxy's certificate into this Secret; the
    # Route's reencrypt trusts it.
    service.beta.openshift.io/serving-cert-secret-name: capacity-planner-tls
spec:
  selector:
    app.kubernetes.io/name: capacity-planner
  # The proxy only. The planner listens on the Pod's loopback.
  ports:
    - name: https
      port: 443
      targetPort: https
