apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Plain Kubernetes: no Service, no Ingress. A user opens the page with
#   kubectl -n <namespace> port-forward pod/capacity-planner-0 8080:8080
# and the Role below is what lets them. By default it is bound to every
# authenticated user; docs/guides/capacity-planner/in-cluster.md narrows it to
# a group. The Role names the one planner Pod; still apply into a namespace
# of its own, so a mistake in it exposes nothing else.
resources:
  - ../base
  - capacity-planner-viewer-role.yaml
  - capacity-planner-viewer-rolebinding.yaml
