apiVersion: apps/v1
kind: Deployment
metadata:
  name: capacity-planner
  labels:
    app.kubernetes.io/name: capacity-planner
    app.kubernetes.io/part-of: llm-d-scaling-manager
spec:
  replicas: 1
  # Recreate: the recordings volume is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: capacity-planner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capacity-planner
        app.kubernetes.io/part-of: llm-d-scaling-manager
    spec:
      serviceAccountName: capacity-planner
      automountServiceAccountToken: false
      enableServiceLinks: false
      # The image's own user. The loader Pod runs as the same user, so the
      # recordings it writes (0600, as the record guide writes them) are
      # readable here. The openshift overlay removes the three IDs: OpenShift
      # assigns them from the namespace's range.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: planner
          image: ghcr.io/llm-d-incubation/llm-d-scaling-manager/capacity-planner
          # Loopback only, with no authentication of its own. Nothing outside
          # the Pod reaches 127.0.0.1: on plain Kubernetes a user reaches it
          # with kubectl port-forward, which RBAC gates (pods/portforward); on
          # OpenShift the oauth-proxy sidecar in this Pod does. The server also
          # refuses a request whose Host is not a loopback name. There is no
          # probe: the kubelet probes the Pod IP, which the server does not bind.
          args:
            - serve
            - --listen=127.0.0.1:8080
            - --auth=none
            - --recordings=/recordings
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: recordings
              mountPath: /recordings
              readOnly: true
      volumes:
        - name: recordings
          persistentVolumeClaim:
            claimName: capacity-planner-recordings
            readOnly: true
