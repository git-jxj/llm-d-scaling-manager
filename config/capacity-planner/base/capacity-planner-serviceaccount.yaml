apiVersion: v1
kind: ServiceAccount
metadata:
  name: capacity-planner
  labels:
    app.kubernetes.io/name: capacity-planner
    app.kubernetes.io/part-of: llm-d-scaling-manager
# The planner reads recordings from a volume and calls no Kubernetes API, so
# it is given no token (the Deployment sets automountServiceAccountToken too).
automountServiceAccountToken: false
