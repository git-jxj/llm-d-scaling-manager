# Optional: only an admin may set, change or remove a namespace's opt-in
# label, scaling-manager.llmd.ai/managed (the kubectl install proposal, "The
# label alone is not consent"). A tenant who can create or edit namespaces
# otherwise opts them in. Admins are the members of system:masters; to name
# another group, edit the group in the expression before applying.
# Needs Kubernetes 1.30 or later (admissionregistration.k8s.io/v1).
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: scaling-manager-label-guard
  labels:
    app.kubernetes.io/name: scaling-manager
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups: [""]
      apiVersions: ["v1"]
      operations: ["CREATE", "UPDATE"]
      resources: ["namespaces"]
  variables:
  - name: now
    expression: >-
      has(object.metadata.labels) && 'scaling-manager.llmd.ai/managed' in object.metadata.labels
      ? object.metadata.labels['scaling-manager.llmd.ai/managed'] : ''
  - name: before
    expression: >-
      oldObject == null || !has(oldObject.metadata.labels) || !('scaling-manager.llmd.ai/managed' in oldObject.metadata.labels)
      ? '' : oldObject.metadata.labels['scaling-manager.llmd.ai/managed']
  validations:
  - expression: "variables.now == variables.before || request.userInfo.groups.exists(g, g == 'system:masters')"
    message: "only a cluster admin may set, change or remove the label scaling-manager.llmd.ai/managed (ValidatingAdmissionPolicy scaling-manager-label-guard)"
    reason: Forbidden
