name: CI - Warm-pool launcher image

# Builds Dockerfile.warmpool-launcher for linux/amd64 and linux/arm64, each on
# its own native runner: the vLLM base is about 10 GB per platform, which one
# runner's disk does not hold twice, and the build's import check runs vLLM's
# Python, which QEMU would make slow. The Dockerfile imports the launcher
# against vLLM in a RUN step, so every leg that finishes has passed that check
# on its platform.
#
# Called by ci-release.yaml (release-warmpool-launcher-build), which pushes
# each platform by digest and joins them into the signed, tagged index.
#
# Run by hand (Actions -> this workflow -> Run workflow) as a dry run of the
# release legs before a release that first carries them: with push unchecked
# it builds both platforms and pushes nothing; checked, it also pushes each
# platform by digest, untagged. A dispatch needs this file on the default branch.
on:
  workflow_call:
    inputs:
      image:
        description: 'Repository to push to, e.g. ghcr.io/<owner>/llm-d-scaling-manager/warmpool-launcher'
        required: true
        type: string
      push:
        description: 'Push each platform by digest and upload the digests as artifacts'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      push:
        description: 'Also push each platform by digest (untagged) to ghcr.io/<owner>/llm-d-scaling-manager/warmpool-launcher'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    strategy:
      # One platform failing must not cancel the other: its log is the evidence.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ${{ inputs.image != '' && inputs.image || format('ghcr.io/{0}/llm-d-scaling-manager/warmpool-launcher', github.repository_owner) }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Free disk space for the vLLM base
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the ${{ matrix.arch }} launcher image, importing the launcher against vLLM
        id: launcher-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.warmpool-launcher
          platforms: ${{ matrix.platform }}
          outputs: ${{ inputs.push && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          sbom: ${{ inputs.push }}
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}

      - name: Record the digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.launcher-push.outputs.digest }}
        run: |
          set -euo pipefail
          [ -n "$DIGEST" ] || { echo "::error::the push step reported no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/launcher-digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/launcher-digests/${{ matrix.arch }}"
          echo "Pushed \`$IMAGE@$DIGEST\` (${{ matrix.platform }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the digest
        if: inputs.push
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: warmpool-launcher-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/launcher-digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
